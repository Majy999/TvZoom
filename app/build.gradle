plugins {
    id "com.android.application"
}

android {
    namespace "com.jypony.tvzoom"
    compileSdk 34

    defaultConfig {
        applicationId "com.jypony.tvzoom"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            java.srcDirs = ["src/main/java", "../third_party/AdbLib/src"]
            manifest.srcFile "src/main/AndroidManifest.xml"
        }
    }
}
